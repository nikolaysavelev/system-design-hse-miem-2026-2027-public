# Вариант стенда: кластер не в сети compose, поды ходят к stateful-сервисам через хост (host.k3d.internal
# и опубликованные порты compose). Так выглядит и внешний managed-сервис: адрес и порт снаружи кластера.
# Подключается поверх values-k3d.yaml: make k8s-deploy HELM_EXTRA="-f ../deploy/charts/soldout/values-k3d-host.yaml".
# На Docker Desktop (macOS, Windows) путь идет через прокси хоста и заметно медленнее (lessons/05/results.md).
external:
  valkeyAddr: host.k3d.internal:6379
  kafkaBrokers: host.k3d.internal:29092          # listener EXTERNAL брокера (compose/lesson-05.yml)
  otlpEndpoint: http://host.k3d.internal:4317
  mailgwUrl: http://host.k3d.internal:8090

secrets:
  data:
    DATABASE_URL: postgres://soldout:soldout@host.k3d.internal:6432/soldout?sslmode=disable
    DATABASE_URL_DIRECT: postgres://soldout:soldout@host.k3d.internal:5432/soldout?sslmode=disable&options=-c%20statement_timeout%3D0
    NOTIFIER_DATABASE_URL: postgres://soldout:soldout@host.k3d.internal:5432/soldout?sslmode=disable
