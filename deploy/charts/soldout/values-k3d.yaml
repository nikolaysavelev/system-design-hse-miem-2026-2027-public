# Стенд курса: кластер k3d, stateful-сервисы в docker compose. Узлы кластера подключены к сети compose
# (deploy/k3d/cluster.yaml), поэтому поды видят сервисы по их именам: CoreDNS кластера спрашивает DNS Docker.
# Для кластера stateful-сервисы внешние: в чарте только их адреса. Вариант через хост: values-k3d-host.yaml.
external:
  valkeyAddr: valkey:6379
  kafkaBrokers: kafka:9092
  otlpEndpoint: http://otel-collector:4317
  mailgwUrl: http://mailgw:8090

# Пароли стенда публичные (soldout/soldout в docker-compose.yml). Свои значения: K8S_DATABASE_URL,
# K8S_DATABASE_URL_DIRECT в soldout/.env.local — make k8s-deploy подставит их вместо этих.
secrets:
  create: true
  data:
    DATABASE_URL: postgres://soldout:soldout@pgbouncer:6432/soldout?sslmode=disable
    DATABASE_URL_DIRECT: postgres://soldout:soldout@postgres:5432/soldout?sslmode=disable&options=-c%20statement_timeout%3D0
    NOTIFIER_DATABASE_URL: postgres://soldout:soldout@postgres:5432/soldout?sslmode=disable

soldout:
  env:
    SEED_ON_START: "true"
    SEED_SEATS_PER_EVENT: "80000"
    LOG_FORMAT: text
    DEPLOYMENT_ENVIRONMENT: lab

notifier:
  env:
    LOG_FORMAT: text
