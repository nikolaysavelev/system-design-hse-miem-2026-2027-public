# PDB: плановое обслуживание узла (drain) не уводит все реплики сразу.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: soldout
  labels:
    {{- include "soldout.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.soldout.pdb.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: soldout
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: notifier
  labels:
    {{- include "soldout.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.notifier.pdb.maxUnavailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: notifier
