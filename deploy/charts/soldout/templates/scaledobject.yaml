{{- $k := .Values.notifier.keda }}
{{- if $k.enabled }}
# KEDA по лагу consumer group: сигнал "потребитель не успевает". HPA для notifier KEDA создает сам.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: notifier
  labels:
    {{- include "soldout.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: notifier
  minReplicaCount: {{ $k.minReplicas }}
  maxReplicaCount: {{ $k.maxReplicas }}
  pollingInterval: {{ $k.pollingInterval }}
  cooldownPeriod: {{ $k.cooldownPeriod }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: {{ $k.cooldownPeriod }}
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: {{ .Values.external.kafkaBrokers | quote }}
        consumerGroup: {{ $k.consumerGroup | quote }}
        topic: {{ $k.topic | quote }}
        lagThreshold: {{ $k.lagThreshold | quote }}
        activationLagThreshold: {{ $k.activationLagThreshold | quote }}
        offsetResetPolicy: earliest
{{- end }}
