{{- $s := .Values.soldout }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: soldout
  labels:
    app.kubernetes.io/name: soldout
    {{- include "soldout.labels" . | nindent 4 }}
spec:
  {{- if not $s.autoscaling.enabled }}
  replicas: {{ $s.replicas }}
  {{- end }}
  # Выкатка без простоя: сначала новый под становится Ready, потом уходит старый.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: soldout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: soldout
        {{- include "soldout.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: {{ $s.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: soldout
          image: "{{ $s.image }}:{{ required "image.tag обязателен" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $s.port }}
          envFrom:
            - configMapRef:
                name: soldout-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ include "soldout.secretName" . }}, key: DATABASE_URL }
            - name: DATABASE_URL_DIRECT
              valueFrom:
                secretKeyRef: { name: {{ include "soldout.secretName" . }}, key: DATABASE_URL_DIRECT }
          resources:
            {{- toYaml $s.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: {{ $s.probes.liveness.path }}, port: http }
            periodSeconds: {{ $s.probes.liveness.periodSeconds }}
            failureThreshold: {{ $s.probes.liveness.failureThreshold }}
            {{- if not $s.probes.enabled }}
            initialDelaySeconds: 20   # демо "без readiness": startupProbe нет, liveness не должна убить под на старте
            {{- end }}
          {{- if $s.probes.enabled }}
          readinessProbe:
            httpGet: { path: {{ $s.probes.readiness.path }}, port: http }
            periodSeconds: {{ $s.probes.readiness.periodSeconds }}
            failureThreshold: {{ $s.probes.readiness.failureThreshold }}
          startupProbe:
            httpGet: { path: {{ $s.probes.startup.path }}, port: http }
            periodSeconds: {{ $s.probes.startup.periodSeconds }}
            failureThreshold: {{ $s.probes.startup.failureThreshold }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ $s.preStopSleepSeconds }}
          {{- end }}
          securityContext:
            {{- include "soldout.containerSecurity" . | nindent 12 }}
