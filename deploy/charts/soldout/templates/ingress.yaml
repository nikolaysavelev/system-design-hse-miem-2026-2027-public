{{- if .Values.soldout.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: soldout
  labels:
    {{- include "soldout.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.soldout.ingress.className }}
  rules:
    - {{- if .Values.soldout.ingress.host }}
      host: {{ .Values.soldout.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: soldout
                port:
                  name: http
{{- end }}
