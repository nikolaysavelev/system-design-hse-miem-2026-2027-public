{{- $a := .Values.soldout.autoscaling }}
{{- if $a.enabled }}
# HPA по CPU: сигнал насыщения самого процесса. Если узкое место ниже (база), реплики растут, а RPS нет.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: soldout
  labels:
    {{- include "soldout.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: soldout
  minReplicas: {{ $a.minReplicas }}
  maxReplicas: {{ $a.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $a.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: {{ $a.scaleDownStabilizationSeconds }}
{{- end }}
