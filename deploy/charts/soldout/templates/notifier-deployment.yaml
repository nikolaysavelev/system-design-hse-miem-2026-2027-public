{{- $n := .Values.notifier }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier
  labels:
    app.kubernetes.io/name: notifier
    {{- include "soldout.labels" . | nindent 4 }}
spec:
  {{- if not $n.keda.enabled }}
  replicas: {{ $n.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notifier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notifier
        {{- include "soldout.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: {{ $n.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notifier
          image: "{{ $n.image }}:{{ required "image.tag обязателен" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/notifier"]
          ports:
            - name: metrics
              containerPort: {{ $n.port }}
          envFrom:
            - configMapRef:
                name: notifier-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ include "soldout.secretName" . }}, key: NOTIFIER_DATABASE_URL }
          resources:
            {{- toYaml $n.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: {{ $n.probes.readiness.path }}, port: metrics }
            periodSeconds: {{ $n.probes.readiness.periodSeconds }}
            failureThreshold: {{ $n.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet: { path: {{ $n.probes.liveness.path }}, port: metrics }
            periodSeconds: {{ $n.probes.liveness.periodSeconds }}
            failureThreshold: {{ $n.probes.liveness.failureThreshold }}
          securityContext:
            {{- include "soldout.containerSecurity" . | nindent 12 }}
