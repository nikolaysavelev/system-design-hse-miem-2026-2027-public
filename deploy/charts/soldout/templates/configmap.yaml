apiVersion: v1
kind: ConfigMap
metadata:
  name: soldout-config
  labels:
    {{- include "soldout.labels" . | nindent 4 }}
data:
  HTTP_ADDR: ":{{ .Values.soldout.port }}"
  VALKEY_ADDR: {{ required "external.valkeyAddr" .Values.external.valkeyAddr | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.external.otlpEndpoint | quote }}
  GOMEMLIMIT: {{ .Values.soldout.gomemlimit | quote }}
  {{- range $k, $v := .Values.soldout.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notifier-config
  labels:
    {{- include "soldout.labels" . | nindent 4 }}
data:
  NOTIFIER_ADDR: ":{{ .Values.notifier.port }}"
  KAFKA_BROKERS: {{ required "external.kafkaBrokers" .Values.external.kafkaBrokers | quote }}
  MAILGW_URL: {{ .Values.external.mailgwUrl | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.external.otlpEndpoint | quote }}
  GOMEMLIMIT: {{ .Values.notifier.gomemlimit | quote }}
  {{- range $k, $v := .Values.notifier.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
