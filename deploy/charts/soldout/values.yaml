# Значения по умолчанию. Адреса внешних сервисов и секреты задаются по окружениям: стенд курса — values-k3d.yaml.
# Каждый Deployment объявляет requests/limits, readiness, liveness и PDB (constitution §5, make lint-k8s).

image:
  tag: lesson-5            # тег обязателен и не latest (deploy/policies/image.rego)
  pullPolicy: IfNotPresent

# Адреса stateful-сервисов вне кластера: на стенде compose, в облаке managed-сервисы (занятия 10 и 14).
external:
  valkeyAddr: ""
  kafkaBrokers: ""
  otlpEndpoint: ""
  mailgwUrl: ""

# Секреты: в проде existingSecret (создает внешний контур), на стенде create: true и значения из values-k3d.yaml.
# Ключи: DATABASE_URL (через PgBouncer), DATABASE_URL_DIRECT (миграции), NOTIFIER_DATABASE_URL.
secrets:
  create: false
  existingSecret: ""
  data: {}

soldout:
  image: soldout
  port: 8080
  # Реплики задает HPA; replicas применяется только при autoscaling.enabled: false.
  replicas: 1
  resources:
    requests: { cpu: 500m, memory: 256Mi }
    limits: { cpu: 2000m, memory: 512Mi }
  # GOMAXPROCS Go 1.25+ берет из лимита CPU cgroup сам; GOMEMLIMIT держим ниже лимита памяти, иначе OOMKilled раньше GC.
  gomemlimit: 440MiB
  probes:
    enabled: true          # false только для демо "выкатка без readiness" (make k8s-rollout NO_READINESS=1)
    readiness: { path: /readyz, periodSeconds: 2, failureThreshold: 2 }
    liveness: { path: /healthz, periodSeconds: 5, failureThreshold: 3 }
    # миграции и seed идут до старта HTTP: на пустой базе seed 240 000 мест занимает до минуты
    startup: { path: /readyz, periodSeconds: 2, failureThreshold: 45 }
  # Пауза перед SIGTERM: за это время под уходит из endpoints, и балансировщик перестает слать в него запросы.
  preStopSleepSeconds: 5
  terminationGracePeriodSeconds: 30
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    scaleDownStabilizationSeconds: 60
  pdb:
    minAvailable: 1
  ingress:
    enabled: true
    className: traefik
    host: ""               # пусто: любой хост (стенд, порт 8089)
  env:
    DB_MAX_CONNS: "40"
    DB_MIN_CONNS: "5"
    DB_MAX_CONN_IDLE: 5m
    DB_ACQUIRE_TIMEOUT: 2s
    HANDLER_TIMEOUT: 3s
    SHUTDOWN_TIMEOUT: 10s
    HOLD_TTL: 10m
    HOLD_EXPIRER_INTERVAL: 5s
    HOLD_EXPIRER_BATCH: "500"
    ADMISSION_TTL: 15m
    TICKET_PRICE_MINOR: "500000"
    PSP_DELAY_MS: "300"
    CACHE_INVALIDATE: "true"
    OUTBOX_DELETE_AFTER_INSERT: "true"
    # Буфер шины событий карты зала на воркер (4 воркера). Шина внутри процесса и at-most-once: при переполнении
    # событие отбрасывается и карта расходится с истиной. 10 000 по умолчанию не хватает на 90 с шторма.
    EVENTBUS_BUFFER: "40000"
    # для прода миграции — отдельный Job перед rollout (deploy/README.md); на стенде под мигрирует при старте
    MIGRATE_ON_START: "true"
    SEED_ON_START: "false"
    OTEL_TRACES_SAMPLER_ARG: "1.0"
    OTEL_NOISY_SAMPLER_ARG: "0.1"
    LOG_FORMAT: json
    DEPLOYMENT_ENVIRONMENT: k8s

notifier:
  image: soldout-notifier
  port: 8091
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { cpu: 500m, memory: 128Mi }
  gomemlimit: 100MiB
  probes:
    readiness: { path: /healthz, periodSeconds: 3, failureThreshold: 3 }
    liveness: { path: /healthz, periodSeconds: 10, failureThreshold: 6 }
  # SIGTERM: начатые письма дорабатывают до 15 с, смещения коммитятся, участник выходит из группы
  terminationGracePeriodSeconds: 30
  pdb:
    maxUnavailable: 1
  # KEDA масштабирует по лагу consumer group. Больше реплик, чем партиций, KEDA не поднимет: лишние простаивали бы.
  keda:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    pollingInterval: 5
    cooldownPeriod: 60
    topic: outbox.event.order
    consumerGroup: notifier
    lagThreshold: "200"
    activationLagThreshold: "50"
  env:
    NOTIFIER_SOURCE: kafka
    NOTIFIER_MAX_ATTEMPTS: "5"
    NOTIFIER_BACKOFF: 500ms,1s,2s,4s
    NOTIFIER_CONCURRENCY: "256"
    LOG_FORMAT: json
