# Argo CD (необязательная часть занятия 5): желаемое состояние в git, кластер подтягивается сам.
# На стенде курса по умолчанию не устанавливается; как попробовать — deploy/README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: soldout
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nikolaysavelev/system-design-practice-hse-miem-26-27.git
    targetRevision: demo/l5-k8s
    path: deploy/charts/soldout
    helm:
      valueFiles:
        - values-k3d.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true   # ручная правка в кластере откатывается к состоянию из git
