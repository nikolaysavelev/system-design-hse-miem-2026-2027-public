# Кластер занятия 5: 1 server + 2 agent. Порт 8080 хоста занят балансировщиком compose, ingress кластера на 8089.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: soldout
servers: 1
agents: 2
# Узлы кластера в сети compose-стенда: поды ходят к PostgreSQL, Kafka и Valkey напрямую по именам сервисов.
# Через host.k3d.internal тоже работает (values-k3d-host.yaml), но на Docker Desktop этот путь идет через
# прокси хоста и вдвое медленнее (lessons/05/results.md). Стенд (make up) должен быть поднят до кластера.
network: soldout_default
ports:
  - port: 8089:80
    nodeFilters:
      - loadbalancer
options:
  k3d:
    wait: true
    timeout: 180s
    # балансировщик k3d (nginx) по умолчанию держит 1024 соединения: шторм в 1000 VU получает connection reset,
    # а kubectl, который ходит через него же, подвисает
    loadbalancer:
      configOverrides:
        - settings.workerConnections=16384
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
