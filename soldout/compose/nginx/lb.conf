# Балансировщик занятия 5. Адреса реплик nginx берет из DNS Docker и перечитывает раз в 5 с (server ... resolve),
# поэтому make scale SOLDOUT=n подхватывается без перезапуска. keepalive к репликам: без него на каждый запрос
# шторма открывалось бы новое TCP-соединение.
worker_processes 2;
events { worker_connections 8192; }

http {
    access_log off;
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream soldout {
        zone soldout 64k;
        server soldout:8080 resolve max_fails=0;
        keepalive 256;
    }

    server {
        listen 8080 reuseport;

        location = /lb-health { return 200 "ok\n"; }

        location / {
            proxy_pass http://soldout;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 120s;      # make pprof-top держит запрос 20-30 с
            proxy_next_upstream error timeout;   # реплика ушла из DNS: повтор на другой, только если запрос не отправлен
        }
    }
}
