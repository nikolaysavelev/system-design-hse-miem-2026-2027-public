# Занятие 5: реплики soldout и notifier находятся по DNS Docker (имя сервиса отдает A-запись на каждую реплику),
# поэтому docker.sock в Prometheus монтировать не нужно. Метка instance = адрес реплики.
global:
  scrape_interval: 5s
scrape_configs:
  - job_name: soldout
    dns_sd_configs:
      - names: ["soldout"]
        type: A
        port: 8080
        refresh_interval: 5s
  - job_name: notifier
    dns_sd_configs:
      - names: ["notifier"]
        type: A
        port: 8091
        refresh_interval: 5s
  - job_name: mailgw
    static_configs:
      - targets: ["mailgw:8090"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: notifier-lag
    static_configs:
      - targets: ["notifier-lag:8091"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: valkey
    static_configs:
      - targets: ["valkey-exporter:9121"]
