# Оверлей занятия 5 поверх lesson-02 + lesson-04: реплики приложений за балансировщиком и выход stateful-сервисов
# на хост для подов k3d. Профиль apps: soldout, lb, notifier. make up K8S=1 поднимает стенд без него, приложения
# тогда живут в кластере (deploy/charts/soldout), а PostgreSQL, Kafka, Valkey и наблюдаемость остаются здесь.
services:
  # Балансировщик перед репликами soldout. Порт 8080 хоста теперь его: k6, pay-demo, curl ходят через lb.
  lb:
    image: nginx:1.29-alpine
    profiles: [apps]
    volumes:
      - ./compose/nginx/lb.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      soldout:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/lb-health >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30
    cpus: 1.0          # на шторме 3 000 RPS nginx занимает 0.2 ядра: лимит 0.25 из спеки был бы впритык
    mem_limit: 128m
    restart: unless-stopped

  soldout:
    image: soldout:lesson-5
    profiles: [apps]
    ports: !override []   # опубликованный порт не дает поднять вторую реплику
    environment:
      # шина событий карты зала внутри процесса: при 80 000 мест шторм на одной реплике переполняет буфер 10 000
      # на воркер, события отбрасываются и I6 краснеет (lessons/05/results.md). То же значение в чарте.
      EVENTBUS_BUFFER: ${EVENTBUS_BUFFER:-40000}

  notifier:
    image: soldout-notifier:lesson-5
    profiles: [apps]
    ports: !override []   # метрики реплик собирает Prometheus по DNS, лаг для make-целей отдает notifier-lag

  mailgw:
    image: soldout-mailgw:lesson-5

  # Один на стенд. Порт 8091 хоста: лаг группы notifier виден при любом числе реплик и в режиме K8S.
  notifier-lag:
    image: soldout-notifier:lesson-5
    ports:
      - "8091:8091"

  invariants:
    image: soldout:lesson-5
    depends_on: !override
      postgres:
        condition: service_healthy

  k6:
    environment:
      BASE_URL: ${K6_BASE_URL:-http://lb:8080}   # режим k8s: ingress кластера (Makefile, MODE)
    depends_on: !override []   # k6 всегда запускается с --no-deps; в режиме K8S сервиса soldout в compose нет

  # Второй listener для клиентов вне сети compose (поды через хост, values-k3d-host.yaml): брокер объявляет
  # себя как host.k3d.internal:29092. На стенде по умолчанию поды в сети compose и ходят на kafka:9092.
  kafka:
    environment:
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://host.k3d.internal:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    ports:
      - "29092:29092"

  prometheus:
    volumes: !override
      - ./compose/prometheus-05.yml:/etc/prometheus/prometheus.yml:ro

  alloy:
    volumes: !override
      - ./compose/alloy/config-05.alloy:/etc/alloy/config.alloy:ro
