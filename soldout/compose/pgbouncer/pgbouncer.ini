; PgBouncer для soldout (занятие 2, шаг A). Transaction pooling; default_pool_size МЕНЬШЕ пула приложения,
; иначе пулер — декорация. max_prepared_statements > 0 — поддержка prepared statements pgx (PgBouncer >= 1.21).
[databases]
soldout = host=postgres port=5432 dbname=soldout

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = soldout
stats_users = soldout

pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 2
max_prepared_statements = 200
server_reset_query_always = 0
server_idle_timeout = 600
query_wait_timeout = 5
ignore_startup_parameters = extra_float_digits
; после рестарта PostgreSQL контейнер меняет IP: короткий DNS-кэш и быстрый повтор логина
dns_max_ttl = 2
dns_nxdomain_ttl = 2
server_login_retry = 1
server_connect_timeout = 3

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
