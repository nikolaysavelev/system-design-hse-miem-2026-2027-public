# Стенд soldout. Базовый файл; оверлеи — compose/lesson-NN.yml и compose/lite.yml.
# Профили: load (k6), tools (invariant-checker), obs (Prometheus + Grafana).
name: soldout

services:
  postgres:
    image: postgres:17-alpine
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements   # статистика запросов (занятие 2)
      - -c
      - pg_stat_statements.track=all
      - -c
      - wal_level=logical                             # понадобится Debezium на занятии 3
      - -c
      - max_connections=100                           # меньше DB_MAX_CONNS приложения — намеренно (ADR-001)
    environment:
      POSTGRES_USER: soldout
      POSTGRES_PASSWORD: soldout
      POSTGRES_DB: soldout
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soldout -d soldout"]
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:9-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  soldout:
    build: .
    image: soldout:lesson-1
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://soldout:soldout@postgres:5432/soldout?sslmode=disable
      VALKEY_ADDR: valkey:6379
      DB_MAX_CONNS: ${DB_MAX_CONNS:-200}
      HOLD_TTL: ${HOLD_TTL:-10m}
      HOLD_EXPIRER_INTERVAL: 5s
      ADMISSION_TTL: 15m
      TICKET_PRICE_MINOR: "500000"
      PSP_FAIL_RATE: ${PSP_FAIL_RATE:-0}
      PSP_DELAY_MS: ${PSP_DELAY_MS:-0}
      FAULT_CRASH_AFTER_COMMIT: ${FAULT_CRASH_AFTER_COMMIT:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      MIGRATE_ON_START: "true"
      SEED_ON_START: "true"
      SEED_SEATS_PER_EVENT: ${SEED_SEATS_PER_EVENT:-40000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/soldout", "-healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  k6:
    image: grafana/k6:1.3.0
    profiles: [load]
    volumes:
      - ./k6:/scripts:ro
      - ./k6/results:/results
    environment:
      BASE_URL: http://soldout:8080
      EVENT_ID: ${EVENT_ID:-10000000-0000-4000-8000-000000000001}
      SEATS_PER_EVENT: ${SEED_SEATS_PER_EVENT:-40000}
    depends_on:
      soldout:
        condition: service_healthy
    entrypoint: ["k6"]
    command: ["run", "/scripts/smoke.js"]

  invariants:
    image: soldout:lesson-1
    build: .
    profiles: [tools]
    entrypoint: ["/invariant-checker"]
    environment:
      DATABASE_URL: postgres://soldout:soldout@postgres:5432/soldout?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.6.0
    profiles: [obs]
    volumes:
      - ./compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.2.0
    profiles: [obs]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./compose/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
