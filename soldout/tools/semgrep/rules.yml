# Fitness functions на semgrep (занятие 4). Запуск: make lint-semgrep (область: internal/booking/app);
# красный пример: make fitness-red-semgrep (tools/semgrep/red). paths в правиле не задаем: semgrep 1.x
# в контейнере без .git отбрасывает по ним все цели, и проверка молча становится пустой.
rules:
  - id: no-network-after-commit
    languages: [go]
    severity: ERROR
    message: >-
      Сетевой вызов ($X.$M) после commit транзакции (InTx) в booking/app. Его потерю при падении процесса система
      не переживёт: это dual write. Событие публикуется через outbox в той же транзакции (constitution §4, ADR-003).
      Осознанное исключение помечается комментарием nolint:after-commit с причиной и // nosemgrep.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: |
                  $E = $S.InTx(...)
                  ...
                  $X.$M(...)
              - pattern: |
                  $E := $S.InTx(...)
                  ...
                  $X.$M(...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(Send|Post|Do|Publish)$
      # горутина после commit с сетевым вызовом внутри: «первый рефлекс» акта 3
      - pattern: |
          $E = $S.InTx(...)
          ...
          go func() { ... }()
      - pattern: |
          $E := $S.InTx(...)
          ...
          go func() { ... }()
